# Vorlage für GitHub Actions: baut die APK auf einem GitHub-Server (dort ist das Android-SDK vorinstalliert).
# Zum Aktivieren nach .github/workflows/schluesselausgabe-apk.yml kopieren.
name: Schlüsselausgabe APK
on:
  push:
    paths: ["schluesselausgabe/**"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: gradle -p schluesselausgabe/android assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Schluesselausgabe-apk
          path: schluesselausgabe/android/app/build/outputs/apk/release/*.apk
